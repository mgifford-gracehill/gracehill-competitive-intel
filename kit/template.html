<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grace Hill Competitive Intelligence</title>
<style>
:root{
  --red:#FF0000; --navy:#262262; --bay:#2E3192; --indigo:#3C137B;
  --cer:#03B8EC; --dcer:#0071B1; --charcoal:#393A3C; --gray:#F5F5F5;
  --muted:#6B6B72; --border:#E3E3E8; --green:#00875A; --amber:#B45309;
  --fd:'Helvetica Now Display','Helvetica Neue',Helvetica,Arial,sans-serif;
  --ft:'Helvetica Now Text','Helvetica Neue',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--ft);color:var(--charcoal);background:#fff;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--fd);margin:0;color:var(--navy);font-weight:300;letter-spacing:-.01em}
h1{font-size:2rem}h2{font-size:1.35rem}h3{font-size:1.05rem;font-weight:700}h4{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
a{color:var(--dcer)}button{font-family:inherit;font-size:inherit;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:24px 22px 80px}

/* header */
header{background:var(--navy);position:sticky;top:0;z-index:60;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.hd{max-width:1280px;margin:0 auto;padding:10px 22px;display:flex;align-items:center;gap:16px}
.hd img{height:26px}
.hd .sep{width:1px;height:22px;background:rgba(255,255,255,.25)}
.hd .nm{font-family:var(--fd);font-size:.9rem;font-weight:700;color:#fff;white-space:nowrap}
#omni{flex:1;min-width:0;padding:9px 14px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;border-radius:20px;font-size:.9rem;font-family:inherit}
#omni::placeholder{color:rgba(255,255,255,.6)}
#omni:focus{outline:none;background:#fff;color:var(--charcoal);border-color:#fff}
nav{display:flex;gap:2px;overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:transparent;border:0;color:rgba(255,255,255,.8);padding:7px 12px;border-radius:6px;font-size:.82rem}
nav button:hover{background:rgba(255,255,255,.12);color:#fff}
nav button.on{background:#fff;color:var(--navy);font-weight:700}
@media(max-width:900px){.hd{flex-wrap:wrap;gap:10px}#omni{order:3;flex-basis:100%}nav{order:4;flex-basis:100%;margin-left:0}}
@media(max-width:700px){
  .pane table,.pbpane table,.view>table{display:block;overflow-x:auto;max-width:100%}
  .grid.g2,.grid.g3{grid-template-columns:1fr}
  .verdict{padding:16px 18px}.verdict .ln{font-size:1rem}
  h1{font-size:1.5rem}.wrap{padding:16px 14px 60px}
  .chips{overflow-x:auto}
}

/* verdict banner — the 10-second answer */
.verdict{border-radius:12px;padding:20px 24px;margin:0 0 22px;color:#fff}
.verdict.compete{background:var(--navy)}
.verdict.partial{background:var(--bay)}
.verdict.no{background:#4A4A52}
.verdict.partner{background:var(--indigo)}
.verdict .st{font-family:var(--fd);font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.verdict .ln{font-size:1.15rem;line-height:1.45;margin-top:6px;font-family:var(--fd);font-weight:300}
.verdict .di{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.25);font-size:.9rem}
.verdict .di b{display:block;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;opacity:.75;margin-bottom:3px}

/* chips */
.chip{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:4px;white-space:nowrap}
.c-t1{background:var(--red);color:#fff}.c-t2{background:var(--bay);color:#fff}
.c-t3{background:#DEDEE4;color:var(--charcoal)}.c-wl{background:#EFEFF4;color:var(--muted)}
.c-cat{background:#EDF6FD;color:var(--dcer)}
.c-ov-h{background:var(--navy);color:#fff}.c-ov-p{background:#E7E7F2;color:var(--bay)}
.c-gh{background:#FFF0F0;color:#C41E1E;border:1px solid #FFD2D2}
.c-yes{background:#E4F4EE;color:var(--green)}.c-no{background:#FCE9E9;color:#C41E1E}
.c-part{background:#FEF3E2;color:var(--amber)}.c-unk{background:#F1F1F4;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* cards */
.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px 20px}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.rule{width:40px;height:3px;background:var(--red);border:0;margin:9px 0 14px}

/* the three-column answer */
.win li,.ask li{margin:0 0 8px}
.ask li{font-style:italic;color:var(--navy)}
.pt{border-left:3px solid var(--cer);padding-left:12px;margin:0 0 10px}
.neg{border-left:3px solid var(--red);padding-left:12px;margin:0 0 10px;font-size:.9rem}
ul.tight{margin:0;padding-left:18px}
ul.tight li{margin:0 0 7px}
.src{font-size:.72rem;color:var(--muted)}
.src a{color:var(--muted)}

/* search results */
.res{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:10px;transition:.12s}
.res:hover{border-color:var(--cer);box-shadow:0 2px 12px rgba(3,184,236,.12)}
.res .t{font-family:var(--fd);font-weight:700;color:var(--navy);font-size:1rem}
.res .s{font-size:.8rem;color:var(--muted);margin-top:2px}
.res .v{font-size:.88rem;margin-top:7px}
.stance{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:4px}
.s-compete{background:var(--navy);color:#fff}.s-partial{background:#E7E7F2;color:var(--bay)}
.s-no{background:#EDEDF0;color:var(--muted)}.s-partner{background:#F0EAF8;color:var(--indigo)}

/* table */
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:left;background:var(--navy);color:#fff;font-family:var(--fd);font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;padding:9px 10px}
.mx-sticky th{position:sticky;top:52px;z-index:5}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
tbody tr:hover{background:#FAFAFD}
.mx{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
.mx th:first-child,.mx td:first-child{position:sticky;left:0;background:#fff;z-index:4;border-right:1px solid var(--border);min-width:230px}
.mx th:first-child{background:var(--navy);z-index:6}
.mx td.gh{background:#F2FBFE;font-weight:700}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:0 0 18px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;color:var(--muted);font-size:.88rem;white-space:nowrap}
.tabs button.on{color:var(--navy);border-bottom-color:var(--red);font-weight:700}
.pane{display:none}.pane.on{display:block}
.pbpane{display:none}.pbpane.on{display:block}
#onepager{display:none}

.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px;padding:12px 14px;background:var(--gray);border-radius:10px}
.filters select,.filters input{padding:8px 11px;border:1px solid var(--border);border-radius:6px;background:#fff;font-family:inherit;font-size:.85rem}
.count{margin-left:auto;font-size:.78rem;color:var(--muted)}
.btn{background:var(--red);color:#fff;border:0;border-radius:6px;padding:9px 16px;font-weight:700;font-size:.85rem}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--border);font-weight:400}
.empty{text-align:center;color:var(--muted);padding:50px;font-style:italic}
.kpi{background:#fff;border:1px solid var(--border);border-top:3px solid var(--red);border-radius:8px;padding:14px 16px}
.kpi .n{font-family:var(--fd);font-weight:300;font-size:2rem;color:var(--navy);line-height:1}
.kpi .l{font-size:.76rem;color:var(--muted);margin-top:4px}
footer{border-top:1px solid var(--border);margin-top:44px;padding:20px;text-align:center;font-size:.76rem;color:var(--muted)}
.stale{font-size:.72rem;color:var(--muted);margin-top:8px}

/* PRINT — the downloadable battlecard */
@media print{
  @page{size:letter;margin:11mm}
  header,nav,.tabs,.filters,.noprint,footer,.pbpane,.scr-title,.scr-sub{display:none!important}
  body.onepage .pane{display:none!important}
  body.onepage #onepager{display:block!important}
  body.onepage .verdict .di{display:none}
  body.onepage .card{padding:6px 8px}
  body.onepage ul.tight li{margin:0 0 2px}
  html,body{font-size:8.2pt;line-height:1.32}
  .wrap{padding:0;max-width:none}
  .view{display:none!important}
  #v-competitor{display:block!important}
  .pane{display:block!important;break-inside:auto}
  .pane:before{content:attr(data-title);display:block;font-family:var(--fd);font-weight:700;font-size:7.4pt;letter-spacing:.09em;text-transform:uppercase;color:#fff;background:#262262;padding:3px 7px;margin:9px 0 6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pane[data-p=answer]:before{margin-top:4px}
  h1{font-size:15pt}h2{font-size:11pt}h3{font-size:9pt}h4{font-size:7pt}
  .card{border:1px solid #ddd;padding:7px 9px;break-inside:avoid;border-radius:5px}
  .grid{gap:7px}.grid.g3{grid-template-columns:1fr 1fr 1fr}.grid.g2{grid-template-columns:1fr 1fr}
  ul.tight{padding-left:13px}ul.tight li{margin:0 0 2.5px}
  .verdict{padding:9px 12px;margin:0 0 8px;border-radius:6px;-webkit-print-color-adjust:exact;print-color-adjust:exact;color:#fff!important}
  .verdict .ln{font-size:10pt;line-height:1.3;margin-top:3px}
  .verdict .di{margin-top:6px;padding-top:5px;font-size:8pt}
  .chip,.stance{-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:6.2pt;padding:1px 5px}
  table{font-size:7.6pt}th{padding:3px 5px;font-size:6.4pt;position:static;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  td{padding:3px 5px}
  .pt,.neg{padding-left:8px;margin:0 0 5px}
  .rule{margin:4px 0 6px;width:26px;height:2px}
  a{text-decoration:none;color:var(--charcoal)}
  .src{font-size:6.6pt}
  .printhdr{display:block!important;border-bottom:2px solid var(--red);padding-bottom:5px;margin-bottom:8px}
  .stale{font-size:6.6pt}
}
.printhdr{display:none}
</style>
</head>
<body>
<header>
  <div class="hd">
    <img src="__LOGO__" alt="Grace Hill">
    <div class="sep"></div>
    <div class="nm">Competitive Intelligence</div>
    <input id="omni" type="search" placeholder="Search a competitor, product, or capability…" autocomplete="off" aria-label="Search">
    <nav id="nav"></nav>
  </div>
</header>

<div class="wrap">
  <div class="printhdr">
    <div style="font-family:var(--fd);font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6B6B72">Grace Hill · Competitive battlecard</div>
    <div id="print-name" style="font-family:var(--fd);font-size:1.6rem;color:#262262"></div>
    <div id="print-meta" style="font-size:.8rem;color:#6B6B72"></div>
  </div>

  <section class="view" id="v-home"></section>
  <section class="view" id="v-playbook"></section>
  <section class="view" id="v-search"></section>
  <section class="view" id="v-competitor"></section>
  <section class="view" id="v-gh"></section>
  <section class="view" id="v-compare"></section>
  <section class="view" id="v-products"></section>
  <section class="view" id="v-news"></section>
</div>
<footer>© 2026 Grace Hill, Inc. All rights reserved. · Internal use · Built <span id="built"></span> · Verify against CRM and win/loss before customer-facing use.</footer>

<script>
const D = __DATA__;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const has=a=>Array.isArray(a)&&a.length>0;
const val=o=>o&&o.value&&o.value!=='Unknown'?o.value:null;
const dq=s=>{let t=String(s||'').trim().replace(/^["“”']+/,'').replace(/["“”']+$/,'');return '“'+esc(t)+'”'};
const deb=(f,ms=130)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
const tierC=t=>({'Tier 1':'c-t1','Tier 2':'c-t2','Tier 3':'c-t3','Watchlist':'c-wl'}[t]||'c-wl');
const stanceC=s=>({'Compete':'s-compete','Partial overlap':'s-partial','Do not compete':'s-no','Partner':'s-partner'}[s]||'s-no');
const vBg=s=>({'Compete':'compete','Partial overlap':'partial','Do not compete':'no','Partner':'partner'}[s]||'no');
const supC=s=>({'Yes':'c-yes','No':'c-no','Partial':'c-part','Unknown':'c-unk'}[s]||'c-unk');
const ovC=d=>({'High':'c-ov-h','Partial':'c-ov-p','None':'c-unk'}[d]||'c-unk');
const OVLEG='<div class="src" style="margin-top:8px"><span class="chip c-ov-h">High</span> same buyer, same budget line — a real head-to-head. <span class="chip c-ov-p">Partial</span> overlaps on part of the job only.</div>';
const uniq=a=>[...new Set(a.filter(Boolean))];
const ul=a=>has(a)?`<ul class="tight">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';
const C=D.competitors, F=D.features, GHB=D.ghBaseline||{}, STACK=D.stack||{}, FW=D.framework||{};
const PERS=D.personas||[], ICP=D.icp||{}, PITCH=D.pitch||{}, SPICEDB=D.spiced||{}, PLAYS=D.plays||{};
const GH=D.ghIndex||[]; const ghById=Object.fromEntries(GH.map(g=>[g.id,g]));
GH.forEach(g=>g._b=[g.name,...(g.aka||[]),g.parent,g.line,g.whatItIs,g.why,...(g.features||[]),...(g.competitors||[])].filter(Boolean).join(' ').toLowerCase());
function searchGH(q){q=q.trim().toLowerCase();if(!q)return[];const terms=q.split(/\s+/);
  return GH.map(g=>{let sc=0;const n=g.name.toLowerCase();
    if(n===q)sc+=100; else if(n.startsWith(q))sc+=70; else if(n.includes(q))sc+=50;
    if((g.aka||[]).some(a=>a.toLowerCase().includes(q)))sc+=40;
    if((g.line||'').toLowerCase().includes(q))sc+=12;
    if(!sc&&terms.every(t=>g._b.includes(t)))sc+=6;
    return sc?{g,sc}:null}).filter(Boolean).sort((a,b)=>b.sc-a.sc).map(x=>x.g)}
function personasFor(c){
  const n=(c.name||'').toLowerCase(), tc=(c.toolCategory||'').toLowerCase();
  const ov=(c.overlaps||[]).map(o=>o.product.toLowerCase()).join(' ');
  return PERS.filter(p=>(p.likelyCompetitors||[]).some(x=>{
    const t=x.toLowerCase();
    return t.includes(n)||n.includes(t.split(' ')[0])||
      (t.includes('status quo')&&c.ciCategory==='Status Quo')||
      (t.includes('pms')&&(tc.includes('property management')||c.id==='pms-incumbents'))||
      (t.includes('conversation intelligence')&&tc.includes('conversation intelligence'));
  }));
}
const FEAT={}; F.lines.forEach(l=>l.features.forEach(f=>FEAT[f.id]={...f,line:l.line}));
const byId=Object.fromEntries(C.map(c=>[c.id,c]));

const TABS=[['home','Competitors'],['playbook','Playbook'],['compare','Compare'],['products','By product'],['news','News']];
function nav(){const n=$('#nav');TABS.forEach(([id,l])=>{const b=document.createElement('button');b.textContent=l;b.dataset.t=id;b.onclick=()=>go(id);n.appendChild(b)})}
function go(v,arg){
  document.body.classList.remove('onepage');
  $$('.view').forEach(x=>x.style.display='none');
  $('#v-'+v).style.display='block';
  $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===v));
  if(v==='competitor')renderCompetitor(arg);
  if(v==='gh')renderGH(arg);
  window.scrollTo(0,0);
}

/* ---------- SEARCH ---------- */
function blob(c){return [c.name,...(c.aka||[]),c.parent,c.toolCategory,c.ciCategory,
  (c.verdict||{}).line,(c.positioning||{}).value,
  ...(c.overlaps||[]).map(o=>o.product),
  ...(c.strengths||[]).map(s=>s.text),...(c.gaps||[]).map(g=>g.text),
  ...(c.whyWeWin||[]),...(c.askThis||[]),
  ...Object.keys(c.features||{}).map(k=>(FEAT[k]||{}).label)
].filter(Boolean).join(' ').toLowerCase()}
C.forEach(c=>c._b=blob(c));

const SYN={policy:'policies',attestation:'acknowledg',training:'training',comps:'comparables',comp:'comparables',shop:'shopping',shops:'shopping',
  self:'diy','e-sign':'esignature',sign:'esignature',reviews:'review',lms:'learning management',
  cec:'credential',ceu:'credential',reputation:'review',video:'video',tours:'tour',
  survey:'surveys',benchmarking:'benchmark',ai:'ai',sso:'integration',esign:'esignature'};
function expand(t){return SYN[t]?[t,SYN[t]]:[t]}
function search(q){
  q=q.trim().toLowerCase(); if(!q)return{direct:[],mentions:[]};
  const terms=q.split(/\s+/);
  const groups=terms.map(expand);
  const scored=C.map(c=>{
    let sc=0, direct=false;
    if(c.name.toLowerCase()===q){sc+=100;direct=true}
    else if(c.name.toLowerCase().startsWith(q)){sc+=60;direct=true}
    else if(c.name.toLowerCase().includes(q)){sc+=40;direct=true}
    if((c.aka||[]).some(a=>a.toLowerCase().includes(q))){sc+=30;direct=true}
    if((c.parent||'').toLowerCase().includes(q)){sc+=25;direct=true}
    if((c.toolCategory||'').toLowerCase().includes(q)){sc+=18;direct=true}
    if((c.overlaps||[]).some(o=>o.product.toLowerCase().includes(q))){sc+=14;direct=true}
    // capability match — searching by feature is a first-class path
    const fl=Object.keys(c.features||{}).filter(k=>{
      const f=FEAT[k]||{};
      const lb=((f.label||'')+' '+(f.why||'')+' '+(f.line||'')).toLowerCase();
      return lb.includes(q)||groups.every(g=>g.some(t=>lb.includes(t)));});
    if(fl.length&&fl.some(k=>['Yes','Partial'].includes((c.features[k]||{}).support))){sc+=20;direct=true}
    else if(fl.length){sc+=6;direct=true}
    if(!direct && groups.every(g=>g.some(t=>c._b.includes(t))))sc+=4;
    if(sc===0)return null;
    if(c.tier==='Tier 1')sc+=3; else if(c.tier==='Tier 2')sc+=1;
    return {c,sc,direct};
  }).filter(Boolean).sort((a,b)=>b.sc-a.sc);
  return {direct:scored.filter(x=>x.direct).map(x=>x.c),
          mentions:scored.filter(x=>!x.direct).map(x=>x.c).slice(0,10)};
}
function resultRow(c){
  const v=c.verdict||{};
  return `<button class="res" onclick="go('competitor','${c.id}')">
    <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">
      <span class="t">${esc(c.name)}</span>
      <span class="stance ${stanceC(v.stance)}">${esc(v.stance||'')}</span>
      <span class="chip ${tierC(c.tier)}">${esc(c.tier||'')}</span>
      <span class="chip c-cat">${esc(c.ciCategory||'')}</span>
    </div>
    <div class="s">${esc(c.toolCategory||'')}${c.parent?' · '+esc(c.parent):''}</div>
    <div class="v">${esc(v.line||'')}</div></button>`;
}
function runSearch(){
  const q=$('#omni').value;
  if(!q.trim()){go('home');return}
  const {direct,mentions}=search(q);
  const ghHits=searchGH(q);
  let h='';
  if(ghHits.length){
    h+=`<h2 style="margin:0 0 4px">Grace Hill</h2><hr class="rule">`+ghHits.map(g=>`
      <button class="res" onclick="go('gh','${g.id}')" style="border-left:3px solid var(--red)">
        <div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap"><span class="t">${esc(g.name)}</span>
        <span class="chip c-gh">${esc(g.type)}</span>${g.parent?`<span class="src">part of ${esc(g.parent)}</span>`:''}</div>
        <div class="v">${esc(g.whatItIs||'')}</div></button>`).join('')+
      (direct.length||mentions.length?'<div style="height:22px"></div>':'');
  }
  if(direct.length){
    h+=`<h1>${direct.length} match${direct.length===1?'':'es'}</h1><hr class="rule">`+direct.map(resultRow).join('');
  }
  if(mentions.length){
    h+=`<h2 style="margin-top:${direct.length?'28px':'0'}">Also mentioned</h2><hr class="rule">
        <p style="color:var(--muted);margin:0 0 12px;font-size:.88rem">These records reference “${esc(q)}” somewhere in their detail.</p>`
      +mentions.map(resultRow).join('');
  }
  if(!h)h=`<div class="empty">Nothing matches “${esc(q)}”. Try a competitor name, a Grace Hill product like Ask Gracie, a product line like Policies, or a capability like fair housing.</div>`;
  $('#v-search').innerHTML=h;
  go('search');
}

/* ---------- COMPETITOR ---------- */
function renderCompetitor(id){
  const c=byId[id]; if(!c)return;
  const v=c.verdict||{}, w=c.whenItComesUp||{}, sl=c.stackLayer||{};
  $('#print-name').textContent=c.name;

            C.find(c=>c.name.toLowerCase().includes(String(n).toLowerCase())||String(n).toLowerCase().includes(c.name.toLowerCase()));
    return m?{n,c:m}:{n,c:null}});
  $('#v-gh').innerHTML=`
  <div class="noprint" style="margin-bottom:14px"><button class="btn ghost" onclick="history.length>1?history.back():go('home')">← Back</button></div>

  ${g.why?`<div class="card" style="margin-bottom:14px"><h4>Why it matters in a deal</h4><hr class="rule"><p style="margin:0">${esc(g.why)}</p></div>`:''}
  ${g.note?`<div class="card" style="margin-bottom:14px;border-top:3px solid var(--red)"><h4>Be precise about this</h4><hr class="rule"><p style="margin:0">${esc(g.note)}</p></div>`:''}
  <div class="grid g2">
    ${has(g.features)?`<div class="card"><h4>Capabilities</h4><hr class="rule">${ul(g.features)}</div>`:''}
    ${has(g.differentiators)?`<div class="card"><h4>Differentiators</h4><hr class="rule">${ul(g.differentiators)}</div>`:''}
  </div>
  ${has(g.proofPoints)?`<div class="card" style="margin-top:14px"><h4>Proof</h4><hr class="rule"><div class="grid g3">${
    g.proofPoints.map(x=>`<div class="kpi"><div class="n" style="font-size:1.4rem">${esc(x.stat||'')}</div><div class="l" style="color:var(--charcoal)">${esc(x.label||'')}</div><div class="l">${esc(x.source||'')}</div></div>`).join('')}</div></div>`:''}
  ${has(g.objections)?`<div class="card" style="margin-top:14px"><h4>Objection handling</h4><hr class="rule">${
    g.objections.map(o=>`<div style="margin-bottom:10px"><div style="font-weight:700;color:var(--navy)">${dq(o.objection)}</div><div class="pt" style="margin-top:5px">${esc(o.response)}</div></div>`).join('')}</div>`:''}
  ${rivals.length?`<div class="card" style="margin-top:14px"><h4>Who you'll meet here</h4><hr class="rule">
    <div class="chips">${rivals.map(r=>r.c?`<span class="chip c-ov-p" style="cursor:pointer" onclick="go('competitor','${r.c.id}')">${esc(r.c.name)} →</span>`:`<span class="chip c-unk">${esc(r.n)}</span>`).join('')}</div></div>`:''}

    <select id="h-cat"><option value="">Any category</option>${uniq(C.map(c=>c.ciCategory)).sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select>

  </div>
  ${OVLEG}
  <div id="h-body" style="margin-top:10px"></div>`;
  ['#h-line','#h-stance','#h-tier','#h-cat'].forEach(x=>$(x).onchange=drawHome);
  $('#h-reset').onclick=()=>{['#h-line','#h-stance','#h-tier','#h-cat'].forEach(x=>$(x).value='');drawHome()};

function drawHome(){
  const fl=$('#h-line').value,fs=$('#h-stance').value,ft=$('#h-tier').value,fc=$('#h-cat').value;
  let l=C.filter(c=>(!fl||(c.overlaps||[]).some(o=>o.product===fl))&&(!fs||(c.verdict||{}).stance===fs)
    &&(!ft||c.tier===ft)&&(!fc||c.ciCategory===fc));
  const ord={'Tier 1':0,'Tier 2':1,'Tier 3':2,'Watchlist':3};
  l.sort((a,b)=>(ord[a.tier]??9)-(ord[b.tier]??9)||a.name.localeCompare(b.name));
  $('#h-count').textContent=`${l.length} of ${C.length}`;
  $('#h-body').innerHTML=l.length?`<div class="mx"><table><thead><tr>
    <th>Competitor</th><th style="width:120px">Stance</th><th style="width:74px">Tier</th><th>What it is</th><th>Overlaps</th></tr></thead><tbody>${
    l.map(c=>{const v=c.verdict||{};return `<tr style="cursor:pointer" onclick="go('competitor','${c.id}')">
      <td><strong style="color:var(--navy)">${esc(c.name)}</strong>${c.parent?`<br><span class="src">${esc(c.parent)}</span>`:''}</td>
      <td><span class="stance ${stanceC(v.stance)}">${esc(v.stance||'')}</span></td>
      <td><span class="chip ${tierC(c.tier)}">${esc((c.tier||'').replace('Tier ','T'))}</span></td>
      <td>${esc(c.toolCategory||'')}</td>
      <td>${(c.overlaps||[]).map(o=>`<span class="chip ${ovC(o.degree)}">${esc(o.product)}</span>`).join(' ')||'<span class="src">—</span>'}</td>
    </tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Nothing matches those filters.</div>';
}

function pbPane(k,btn){$$('#v-playbook .pbpane').forEach(p=>p.classList.toggle('on',p.dataset.p===k));

/* ---------- COMPARE MATRIX ---------- */
function renderCompare(){
  const lines=F.lines.map(l=>l.line);
  $('#v-compare').innerHTML=`<h1>Feature comparison</h1><hr class="rule">
  <div class="filters noprint">
    <select id="mx-line">${lines.map(l=>`<option>${esc(l)}</option>`).join('')}</select>
    <select id="mx-stance"><option value="">All competitors</option><option>Compete</option><option>Partial overlap</option></select>
    <span class="count" id="mx-count"></span>
  </div>
  <div id="mx-body"></div>`;
  $('#mx-line').onchange=drawMatrix; $('#mx-stance').onchange=drawMatrix; drawMatrix();
}
function drawMatrix(){
  const line=$('#mx-line').value, fs=$('#mx-stance').value;
  const feats=(F.lines.find(l=>l.line===line)||{features:[]}).features;
  const ids=feats.map(f=>f.id);
  let cols=C.filter(c=>ids.some(i=>(c.features||{})[i]) && (!fs||(c.verdict||{}).stance===fs));
  cols.sort((a,b)=>({'Tier 1':0,'Tier 2':1,'Tier 3':2,'Watchlist':3}[a.tier]??9)-({'Tier 1':0,'Tier 2':1,'Tier 3':2,'Watchlist':3}[b.tier]??9)||a.name.localeCompare(b.name));
  cols=cols.slice(0,14);
  $('#mx-count').textContent=`${cols.length} competitors · ${feats.length} capabilities`;
  if(!cols.length){$('#mx-body').innerHTML='<div class="empty">No competitors recorded against this line yet.</div>';return}
  $('#mx-body').innerHTML=`<div class="mx mx-sticky"><table><thead><tr><th>Capability</th><th style="background:#03B8EC;color:#262262">Grace Hill</th>${
    cols.map(c=>`<th>${esc(c.name)}</th>`).join('')}</tr></thead><tbody>${
    feats.map(f=>`<tr><td><strong>${esc(f.label)}</strong>${f.why?`<br><span class="src">${esc(f.why)}</span>`:''}</td>
      <td class="gh">${(()=>{const g=GHB[f.id]||{support:'Unknown'};return `<span class="chip ${supC(g.support)}" title="${esc(g.note||'')}">${esc(g.support)}</span>`})()}</td>
      ${cols.map(c=>{const v=(c.features||{})[f.id]||{support:'Unknown'};
        return `<td title="${esc(v.note||'')}"><span class="chip ${supC(v.support)}">${esc(v.support)}</span></td>`}).join('')}</tr>`).join('')}
  </tbody></table></div>
  <p class="src" style="margin-top:12px">The Grace Hill column is scored the same way as everyone else's — 14 Partial and 3 No/Roadmap across the set. Hover for what we actually do. <strong>Unknown</strong> means no public vendor source states it — never present Unknown as a No to a buyer. Hover a cell for detail.</p>`;
}

/* ---------- BY PRODUCT ---------- */
function renderProducts(){
  const lines=F.lines.map(l=>l.line);
  $('#v-products').innerHTML=`<h1>By product line</h1><hr class="rule">
  <p style="color:var(--muted);max-width:62ch;margin:0 0 18px">Who you'll actually meet when you're selling each line, ranked by tier.</p>
  ${lines.map(l=>{
    const set=C.filter(c=>(c.overlaps||[]).some(o=>o.product===l)||Object.keys(c.features||{}).some(k=>(FEAT[k]||{}).line===l));
    if(!set.length)return '';
    set.sort((a,b)=>({'Tier 1':0,'Tier 2':1,'Tier 3':2,'Watchlist':3}[a.tier]??9)-({'Tier 1':0,'Tier 2':1,'Tier 3':2,'Watchlist':3}[b.tier]??9));
    return `<h2 style="margin-top:26px">${esc(l)}</h2><hr class="rule">
    <div class="grid g3">${set.slice(0,12).map(c=>`
      <button class="res" style="margin:0" onclick="go('competitor','${c.id}')">
        <div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap"><span class="t">${esc(c.name)}</span>
        <span class="chip ${tierC(c.tier)}">${esc(c.tier)}</span></div>
        <div class="s">${esc(c.toolCategory||'')}</div>
        <div class="v">${esc((c.verdict||{}).line||'')}</div></button>`).join('')}</div>`;
  }).join('')}`;
}

function renderNews(){
  const N=D.news;
  $('#v-news').innerHTML=`<h1>Weekly digest</h1><hr class="rule">
  <p style="color:var(--muted);margin:0 0 16px">${esc(N.weekOf)} · ${esc(N.coverageWindow)}</p>
  <div class="verdict compete" style="margin-bottom:20px"><div class="st">This week's talk track</div><div class="ln" style="font-size:1rem">${esc(N.talkTrack)}</div></div>
  ${N.items.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(i=>`
    <div class="card" style="margin-bottom:12px">
      <div class="src" style="margin-bottom:5px">${esc(i.date)} · ${esc(i.source)}</div>

      <div class="pt" style="border-left-color:var(--red)"><strong style="font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--red);display:block;margin-bottom:2px">Why it matters</strong>${esc(i.soWhat)}</div>
      <div class="src" style="margin-top:8px"><a href="${esc(i.url)}" target="_blank" rel="noopener">Read the source ↗</a></div></div>`).join('')}`;
